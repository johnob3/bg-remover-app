<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - AI Powered</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px 20px;
            margin: 30px 0;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #495057);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        .preview-container {
            display: none;
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .preview-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .preview-item {
            text-align: center;
        }

        .preview-item h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: white;
            padding: 10px;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .features h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .feature-item {
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            text-align: center;
        }

        .feature-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .feature-text {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .preview-images {
                grid-template-columns: 1fr;
            }
            
            .upload-area {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-magic"></i> Background Remover</h1>
            <p>Remove backgrounds from your images with AI-powered precision</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="upload-text">Drag & drop your image here</div>
            <div class="upload-subtext">or click to browse files</div>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Removing background... Please wait</div>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        
        <div class="retry-container" id="retryContainer" style="display: none; margin: 20px 0; text-align: center;">
            <button class="btn btn-secondary" id="retryBtn">
                <i class="fas fa-redo"></i> Try Again
            </button>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="preview-images">
                <div class="preview-item">
                    <h3>Original Image</h3>
                    <img id="originalImage" class="preview-image" alt="Original">
                </div>
                <div class="preview-item">
                    <h3>Background Removed</h3>
                    <img id="processedImage" class="preview-image" alt="Processed">
                </div>
            </div>
            <button class="btn" id="downloadBtn">
                <i class="fas fa-download"></i> Download Result
            </button>
            <button class="btn btn-secondary" id="newImageBtn">
                <i class="fas fa-plus"></i> Process New Image
            </button>
        </div>

        <div class="features">
            <h3>Why Choose Our Background Remover?</h3>
            <div class="feature-grid">
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="feature-text">AI-Powered</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <div class="feature-text">Fast Processing</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="feature-text">Privacy Safe</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-mobile-alt"></i>
                    </div>
                    <div class="feature-text">Mobile Friendly</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const success = document.getElementById('success');
        const previewContainer = document.getElementById('previewContainer');
        const originalImage = document.getElementById('originalImage');
        const processedImage = document.getElementById('processedImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const newImageBtn = document.getElementById('newImageBtn');
        const retryContainer = document.getElementById('retryContainer');
        const retryBtn = document.getElementById('retryBtn');

        let currentFilename = '';
        let lastUploadedFile = null;

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file.');
                return;
            }

            // Validate file size (8MB limit for lightweight version)
            if (file.size > 8 * 1024 * 1024) {
                showError('File size must be less than 8MB.');
                return;
            }

            // Store the file for potential retry
            lastUploadedFile = file;

            // Show original image preview
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // Upload and process
            uploadAndProcess(file);
        }

        function uploadAndProcess(file, retryCount = 0) {
            const formData = new FormData();
            formData.append('file', file);

            showLoading();
            hideError();
            hideSuccess();
            hidePreview();

            // Update loading text for retries
            const loadingText = document.querySelector('.loading-text');
            if (retryCount > 0) {
                loadingText.textContent = `Retrying... (Attempt ${retryCount + 1})`;
            } else {
                loadingText.textContent = 'Removing background... Please wait';
            }

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                
                if (data.success) {
                    currentFilename = data.output_filename;
                    processedImage.src = data.preview;
                    showPreview();
                    showSuccess(data.message || 'Background removed successfully!');
                } else {
                    // Check if we should retry
                    if (data.retry_suggestion && retryCount < 2) {
                        showError(`Attempt ${retryCount + 1} failed. Retrying automatically...`);
                        setTimeout(() => {
                            uploadAndProcess(file, retryCount + 1);
                        }, 2000); // Wait 2 seconds before retry
                    } else {
                        showError(data.error || 'Failed to remove background. Please try again.');
                        showRetryButton();
                    }
                }
            })
            .catch(err => {
                hideLoading();
                if (retryCount < 2) {
                    showError(`Network error. Retrying... (Attempt ${retryCount + 1})`);
                    setTimeout(() => {
                        uploadAndProcess(file, retryCount + 1);
                    }, 2000);
                } else {
                    showError('Network error. Please check your connection and try again.');
                    showRetryButton();
                }
                console.error('Error:', err);
            });
        }

        function showLoading() {
            loading.style.display = 'block';
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        function hideError() {
            error.style.display = 'none';
        }

        function showSuccess(message) {
            success.textContent = message;
            success.style.display = 'block';
        }

        function hideSuccess() {
            success.style.display = 'none';
        }

        function showPreview() {
            previewContainer.style.display = 'block';
        }

        function hidePreview() {
            previewContainer.style.display = 'none';
        }

        function showRetryButton() {
            retryContainer.style.display = 'block';
        }

        function hideRetryButton() {
            retryContainer.style.display = 'none';
        }

        downloadBtn.addEventListener('click', () => {
            if (currentFilename) {
                window.open(`/download/${currentFilename}`, '_blank');
            }
        });

        newImageBtn.addEventListener('click', () => {
            hidePreview();
            hideError();
            hideSuccess();
            hideRetryButton();
            fileInput.value = '';
            currentFilename = '';
            lastUploadedFile = null;
        });

        retryBtn.addEventListener('click', () => {
            if (lastUploadedFile) {
                hideRetryButton();
                uploadAndProcess(lastUploadedFile);
            }
        });
    </script>
</body>
</html>
